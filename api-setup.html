<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>配置 DeepSeek｜猫在</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5efdf;color:#3f392f;font:16px/1.6 system-ui,sans-serif}.card{width:min(520px,calc(100% - 40px));padding:32px;border:1px solid #b9aa86;border-radius:18px;background:#fffaf0;box-shadow:0 18px 50px #62533222}h1{margin-top:0}label{display:block;font-weight:700}input{box-sizing:border-box;width:100%;margin:8px 0 16px;padding:12px;border:1px solid #9b8e71;border-radius:9px;font:inherit}button,a{display:inline-block;padding:11px 18px;border:0;border-radius:999px;background:#355f4b;color:white;font:inherit;text-decoration:none;cursor:pointer}.note{font-size:14px;color:#6d6456}.danger{color:#9b3d2d}.hidden{display:none}#status{min-height:26px}
  </style>
</head>
<body>
  <main class="card">
    <h1>连接 DeepSeek</h1>
    <p class="danger">刚才发到聊天里的旧密钥请先在 DeepSeek 控制台删除，并创建一把新密钥。</p>
    <form id="form">
      <label for="key">新的 API 密钥</label>
      <input id="key" type="password" autocomplete="off" required placeholder="sk-…">
      <button type="submit">仅在本机连接</button>
    </form>
    <p class="note">密钥只保存在当前本机服务的内存中，不写入文件；服务重启后需要重新输入。</p>
    <p id="status" role="status"></p>
    <a id="open" class="hidden" href="/">打开猫在</a>
  </main>
  <script>
    const form=document.querySelector("#form"),status=document.querySelector("#status"),open=document.querySelector("#open");
    form.addEventListener("submit",async(event)=>{event.preventDefault();status.textContent="正在连接…";try{const response=await fetch("/api/config/deepseek",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({apiKey:document.querySelector("#key").value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"连接失败");form.reset();form.classList.add("hidden");open.classList.remove("hidden");status.textContent=`已连接 ${data.model}。`;}catch(error){status.textContent=error.message;}});
  </script>
</body>
</html>
